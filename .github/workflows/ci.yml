name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest tests/ -v
        # No ANTHROPIC_API_KEY is configured here on purpose: suggest_fix's unit
        # tests mock the Anthropic client, and its one live/integration test
        # (tests/test_suggest_fix.py::test_live_suggest_fix_against_real_api)
        # is skipped automatically whenever the key isn't set, so CI never
        # makes a real API call or spends money on a push.
